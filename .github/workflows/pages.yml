name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  SITE_URL: https://amadeohm.github.io

jobs:
  build:
    if: github.repository == 'amadeohm/amadeohm.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check and build the production website
        run: npm test
      - name: Verify production URLs and indexing
        run: node scripts/check-pages-build.mjs
      - name: Package the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Deliberately disabled until the owner approves the first publication.
  # An absent variable is false. Uploading code does not enable this job.
  deploy:
    if: >-
      github.repository == 'amadeohm/amadeohm.github.io' &&
      github.ref == 'refs/heads/main' &&
      vars.PAGES_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish the verified build
        id: deployment
        uses: actions/deploy-pages@v4
